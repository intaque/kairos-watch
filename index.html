<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kairos — World Clock</title>
<link rel="icon" id="favicon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ff6a2b'/%3E%3Ccircle cx='32' cy='32' r='22' fill='%23f3f2eb'/%3E%3Cline x1='32' y1='32' x2='32' y2='19' stroke='%23121212' stroke-width='5' stroke-linecap='round' transform='rotate(305 32 32)'/%3E%3Cline x1='32' y1='32' x2='32' y2='13' stroke='%23121212' stroke-width='3.5' stroke-linecap='round' transform='rotate(60 32 32)'/%3E%3Ccircle cx='32' cy='32' r='3' fill='%23ff6a2b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e6e4dc;
    --panel: #f3f2eb;
    --chip: #e2e0d6;
    --ink: #121212;
    --muted: rgba(18, 18, 18, 0.5);
    --line: rgba(18, 18, 18, 0.07);
    --accent: #ff6a2b;
    --shadow: 0 14px 30px rgba(0, 0, 0, 0.25);
    --display: "Unbounded", "Arial Black", system-ui, sans-serif;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0a0b0e;
    --panel: #15171c;
    --chip: #232730;
    --ink: #f4f1ea;
    --muted: rgba(244, 241, 234, 0.5);
    --line: rgba(244, 241, 234, 0.06);
    --accent: #ff7a3d;
    --shadow: 0 14px 30px rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }

  body {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--ink);
    min-height: 100dvh; transition: background 0.3s ease, color 0.3s ease;
  }

  .app {
    max-width: 1400px; margin: 0 auto; min-height: 100dvh;
    padding: clamp(10px, 2vw, 28px);
    display: flex; flex-direction: column;
  }

  /* ---------- Top bar ---------- */
  .bar { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; padding-bottom: 14px; }
  .logo { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 0.8rem; letter-spacing: 0.08em; white-space: nowrap; }
  .logo .mark { width: 28px; height: 28px; display: block; flex: none; }
  .logo .mark .arm-up { transform-origin: 11.5px 16px; transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .logo:hover .mark .arm-up { transform: rotate(-16deg); }
  .logo span { letter-spacing: 0.22em; }
  .seg { display: inline-flex; background: var(--chip); border-radius: 999px; padding: 3px; }
  .seg button {
    appearance: none; border: 0; background: transparent; color: var(--ink); cursor: pointer;
    font: 600 0.74rem "Inter", sans-serif; padding: 7px 13px; border-radius: 999px; transition: background 0.2s, color 0.2s;
  }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
  .search { position: relative; flex: 1; min-width: 180px; max-width: 380px; margin: 0 auto; }
  .search svg { position: absolute; left: 14px; top: 50%; width: 15px; height: 15px; transform: translateY(-50%); stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; pointer-events: none; }
  .search input {
    width: 100%; font: 500 0.82rem "Inter", sans-serif; color: var(--ink);
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 10px 14px 10px 38px; outline: none;
  }
  .search input:focus { border-color: var(--accent); }
  .search input::placeholder { color: var(--muted); }
  .results {
    position: absolute; z-index: 20; top: calc(100% + 6px); left: 0; right: 0; list-style: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden;
  }
  .results li { display: flex; justify-content: space-between; gap: 10px; padding: 10px 14px; font-size: 0.82rem; cursor: pointer; }
  .results li small { color: var(--muted); font-size: 0.72rem; }
  .results li:hover, .results li[aria-selected="true"] { background: var(--chip); }
  .actions { display: flex; gap: 8px; }
  .ib {
    width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line); color: var(--ink);
    transition: transform 0.15s, border-color 0.2s;
  }
  .ib:hover { border-color: var(--accent); }
  .ib:active { transform: scale(0.94); }
  .ib svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .ib:focus-visible, .seg button:focus-visible, .city:focus-visible, .add:focus-visible, .rm:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ic-sun { display: none; }
  :root[data-theme="dark"] .ic-sun { display: block; }
  :root[data-theme="dark"] .ic-moon { display: none; }

  /* ---------- Clock panel ---------- */
  .panel {
    position: relative; background-color: var(--panel);
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 56px 56px; background-position: center top;
    border-radius: 28px 28px 0 0;
    padding: clamp(34px, 5vw, 56px) clamp(12px, 3vw, 40px) 0;
  }
  .live { position: absolute; top: 16px; left: 20px; display: flex; align-items: center; gap: 8px; font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: blink 2s ease-in-out infinite; }

  .timewrap { position: relative; width: fit-content; margin: 0 auto; }
  .time {
    display: flex; justify-content: center; align-items: flex-end;
    font-family: var(--display); font-weight: 800; line-height: 1;
    font-size: clamp(2.8rem, min(14.5vw, 24vh), 13rem);
  }
  .unit { display: flex; flex-direction: column; align-items: center; }
  .lab { font: 500 0.7rem "Inter", sans-serif; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.9rem; }
  .pair { display: flex; }
  .dg { display: inline-block; width: 0.82em; text-align: center; }
  .dg.flip { animation: digitIn 0.38s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .unit.sec .dg { color: var(--accent); }
  .colon { height: 1em; width: 0.34em; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 0.17em; animation: pulse 1s ease-in-out infinite; }
  .colon i { display: block; width: 0.1em; height: 0.1em; background: var(--ink); }
  .ampm {
    position: absolute; right: 0; top: -2rem; font: 700 0.72rem "Inter", sans-serif; letter-spacing: 0.1em;
    padding: 5px 11px; border-radius: 999px; background: var(--ink); color: var(--panel);
  }

  .analog { width: min(68vw, 44vh, 420px); aspect-ratio: 1; margin: 0 auto; }
  .analog svg { width: 100%; height: 100%; overflow: visible; }
  .a-face { fill: var(--chip); stroke: var(--ink); stroke-width: 2.5; }
  .a-tick { stroke: var(--muted); stroke-linecap: round; }
  .a-tick.major { stroke: var(--ink); stroke-width: 2.4; }
  .a-num { fill: var(--ink); font-family: var(--display); font-weight: 500; font-size: 12px; text-anchor: middle; dominant-baseline: central; }
  .a-brand { fill: var(--muted); font: 600 5px "Inter", sans-serif; letter-spacing: 2px; text-anchor: middle; }
  .a-win rect { fill: var(--panel); stroke: var(--line); stroke-width: 0.8; }
  .a-win text { fill: var(--accent); font: 700 7px "Inter", sans-serif; text-anchor: middle; dominant-baseline: central; }
  .hand { stroke-linecap: round; transform-origin: 100px 100px; }
  .hand.h { stroke: var(--ink); stroke-width: 5.5; }
  .hand.m { stroke: var(--ink); stroke-width: 3.5; }
  .hand.s { stroke: var(--accent); stroke-width: 1.8; }
  .hub { fill: var(--accent); }
  .hub-in { fill: var(--panel); }

  /* ---------- City strip ---------- */
  .strip {
    display: flex; gap: 8px; overflow-x: auto; padding: 22px 2px 16px;
    margin-top: clamp(10px, 2.5vw, 30px);
    scroll-snap-type: x proximity; scrollbar-width: none;
  }
  .strip::-webkit-scrollbar { display: none; }
  .cw { position: relative; flex: 0 0 auto; scroll-snap-align: center; }
  .city {
    appearance: none; display: flex; flex-direction: column; gap: 5px; text-align: left; cursor: grab;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    width: clamp(116px, 11vw, 154px); min-height: 92px; padding: 12px 14px; border-radius: 16px;
    background: transparent; border: 1px solid transparent; color: var(--ink); font: inherit;
    transition: background 0.2s, transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s;
  }
  .city:hover { background: var(--chip); }
  .city[aria-pressed="true"] { background: var(--ink); color: var(--panel); transform: translateY(-12px); box-shadow: var(--shadow); }
  .cn { font-size: 0.72rem; font-weight: 500; opacity: 0.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ct { display: flex; align-items: baseline; gap: 5px; font-family: var(--display); font-weight: 700; font-size: 1.2rem; font-variant-numeric: tabular-nums; }
  .ct small { font: 600 0.62rem "Inter", sans-serif; opacity: 0.6; letter-spacing: 0.06em; }
  .cd { font-size: 0.66rem; opacity: 0.55; white-space: nowrap; }
  .rm {
    position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; border-radius: 50%; border: 0; cursor: pointer;
    background: var(--chip); color: var(--ink); font-size: 0.8rem; line-height: 1; opacity: 0; transition: opacity 0.15s; display: grid; place-items: center;
  }
  .cw:hover .rm, .cw:focus-within .rm { opacity: 1; }
  .add {
    appearance: none; cursor: pointer; flex: 0 0 auto; width: 92px; min-height: 92px; border-radius: 16px; background: transparent;
    border: 1px dashed var(--muted); color: var(--muted); font: 500 0.72rem "Inter", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; align-self: stretch;
  }
  .add:hover { color: var(--ink); border-color: var(--ink); }
  .add b { font-size: 1.3rem; font-weight: 400; line-height: 1; }

  /* Drag to rearrange */
  .strip.is-dragging { scroll-snap-type: none; user-select: none; -webkit-user-select: none; cursor: grabbing; }
  .cw.dragging { z-index: 5; will-change: transform; }
  .cw.dragging .city { cursor: grabbing; box-shadow: var(--shadow); background: var(--chip); }
  .cw.dragging .city[aria-pressed="true"] { background: var(--ink); }
  .cw.dragging .rm { opacity: 0; }

  /* ---------- Scene ---------- */
  .scene { position: relative; flex: 1 1 auto; min-height: clamp(240px, 36vh, 440px); border-radius: 0 0 28px 28px; overflow: hidden; background: #111; }
  .scene > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .scene::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,0.5)); }
  .where {
    position: absolute; z-index: 2; left: clamp(16px, 3vw, 40px); bottom: clamp(16px, 3vw, 36px); right: 330px;
    font-family: var(--display); font-weight: 800; text-transform: uppercase; color: #fff; line-height: 1.08;
    font-size: clamp(1.3rem, 4vw, 3.3rem); text-shadow: 0 2px 24px rgba(0, 0, 0, 0.45);
  }
  .where span { display: block; }
  .where span + span { font-size: 0.62em; font-weight: 700; opacity: 0.92; }
  .datecard {
    position: absolute; z-index: 2; right: clamp(12px, 2.5vw, 32px); bottom: clamp(12px, 2.5vw, 32px);
    width: clamp(220px, 24vw, 300px); padding: 16px 18px; border-radius: 20px; color: #fff;
    background: rgba(18, 20, 26, 0.42); border: 1px solid rgba(255, 255, 255, 0.18);
    -webkit-backdrop-filter: blur(16px) saturate(130%); backdrop-filter: blur(16px) saturate(130%);
    display: flex; flex-direction: column; gap: 8px;
  }
  .dc-top { display: flex; justify-content: space-between; align-items: center; font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.85; }
  .phase { padding: 3px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.16); letter-spacing: 0.08em; font-weight: 600; }
  .dc-date { font-family: var(--display); font-weight: 700; font-size: 1.15rem; line-height: 1.2; }
  .dc-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 0.7rem; opacity: 0.75; }
  .dc-bar { height: 3px; border-radius: 99px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
  .dc-bar i { display: block; height: 100%; width: 100%; transform-origin: left; background: var(--accent); }

  /* ---------- Fullscreen ---------- */
  body.is-full .app { padding: 0; max-width: none; }
  body.is-full .bar { position: absolute; z-index: 30; top: 0; left: 0; right: 0; padding: 14px 20px; opacity: 0; transition: opacity 0.35s; }
  body.is-full .bar:hover, body.is-full .bar:focus-within { opacity: 1; }
  body.is-full .panel, body.is-full .scene { border-radius: 0; }
  body.is-full .time { font-size: clamp(3rem, min(16vw, 30vh), 22rem); }

  @keyframes digitIn { from { opacity: 0.15; transform: translateY(-12%); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  @media (max-width: 760px) {
    .where { right: 16px; bottom: 150px; }
    .datecard { left: 12px; right: 12px; width: auto; }
    .scene { min-height: 360px; }
    .search { order: 5; flex-basis: 100%; max-width: none; }
    .actions { margin-left: auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    .colon, .live i, .dg.flip { animation: none; }
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="logo" aria-label="Kairos">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="var(--accent)"/>
        <path d="M11.5 7v18" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <path class="arm-up" d="M11.5 16L22 7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <path d="M11.5 16L21 24.5" fill="none" stroke="#121212" stroke-width="3" stroke-linecap="round"/>
        <circle cx="11.5" cy="16" r="2.6" fill="#121212" stroke="#fff" stroke-width="1.6"/>
      </svg>
      <span>KAIROS</span>
    </div>
    <div class="seg" role="group" aria-label="Time format">
      <button type="button" id="f12" aria-pressed="false">12h</button>
      <button type="button" id="f24" aria-pressed="true">24h</button>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search" type="text" placeholder="Search for a timezone" autocomplete="off" spellcheck="false" aria-label="Search for a city to add" aria-controls="results">
      <ul class="results" id="results" role="listbox" hidden></ul>
    </div>
    <div class="actions">
      <button class="ib" id="viewBtn" type="button" title="Digital / analog (V)" aria-label="Switch digital or analog view">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      </button>
      <button class="ib" id="themeBtn" type="button" title="Light / dark (T)" aria-label="Toggle theme">
        <svg class="ic-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="ic-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
      </button>
      <button class="ib" id="fsBtn" type="button" title="Fullscreen (F)" aria-label="Toggle fullscreen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </header>

  <section class="panel" aria-label="Current time">
    <div class="live"><i></i>Live</div>

    <div class="timewrap" id="timeWrap">
      <div class="time" role="timer" aria-live="off">
        <div class="unit"><span class="lab">hours</span><span class="pair"><span class="dg" id="d0">0</span><span class="dg" id="d1">0</span></span></div>
        <div class="colon" aria-hidden="true"><i></i><i></i></div>
        <div class="unit"><span class="lab">minutes</span><span class="pair"><span class="dg" id="d2">0</span><span class="dg" id="d3">0</span></span></div>
        <div class="colon" aria-hidden="true"><i></i><i></i></div>
        <div class="unit sec"><span class="lab">seconds</span><span class="pair"><span class="dg" id="d4">0</span><span class="dg" id="d5">0</span></span></div>
      </div>
      <span class="ampm" id="ampm" hidden>AM</span>
    </div>

    <div class="analog" id="analog" hidden>
      <svg viewBox="0 0 200 200" role="img" aria-label="Analog clock">
        <circle class="a-face" cx="100" cy="100" r="96"/>
        <g id="aTicks"></g>
        <g id="aNums"></g>
        <text class="a-brand" id="aBrand" x="100" y="70">CITY</text>
        <g class="a-win"><rect x="79" y="127" width="42" height="17" rx="5"/><text id="aDate" x="100" y="135.5">—</text></g>
        <line class="hand h" id="hHand" x1="100" y1="106" x2="100" y2="58"/>
        <line class="hand m" id="mHand" x1="100" y1="108" x2="100" y2="32"/>
        <line class="hand s" id="sHand" x1="100" y1="116" x2="100" y2="20"/>
        <circle class="hub" cx="100" cy="100" r="5"/>
        <circle class="hub-in" cx="100" cy="100" r="2"/>
      </svg>
    </div>

    <div class="strip" id="strip" role="list" aria-label="Cities"></div>
  </section>

  <section class="scene" aria-label="Selected city">
    <svg viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop id="skyTop" offset="0" stop-color="#4aa3f5"/><stop id="skyBot" offset="1" stop-color="#bfe3ff"/></linearGradient>
        <radialGradient id="sunGlow"><stop offset="0" stop-color="#fff6d0" stop-opacity="0.95"/><stop offset="0.35" stop-color="#ffd27a" stop-opacity="0.45"/><stop offset="1" stop-color="#ffb066" stop-opacity="0"/></radialGradient>
        <radialGradient id="moonGlow"><stop offset="0" stop-color="#dfe6ff" stop-opacity="0.55"/><stop offset="1" stop-color="#9fb2ff" stop-opacity="0"/></radialGradient>
      </defs>
      <rect width="1200" height="420" fill="url(#sky)"/>
      <g id="stars"></g>
      <g id="sunG"><circle r="160" fill="url(#sunGlow)"/><circle r="26" fill="#fff3c4"/></g>
      <g id="moonG"><circle r="90" fill="url(#moonGlow)"/><circle r="20" fill="#eef2ff"/><circle cx="-6" cy="-4" r="4" fill="#d3d9f3"/><circle cx="6" cy="6" r="2.6" fill="#d3d9f3"/></g>
      <path id="hillBack" d="M0 300 C150 230 300 265 450 240 S750 205 900 250 S1100 228 1200 262 L1200 420 L0 420Z"/>
      <g id="skyline"></g>
      <path id="hillMid" d="M0 345 C200 292 380 335 560 312 S900 282 1200 334 L1200 420 L0 420Z"/>
      <path id="hillFront" d="M0 390 C250 352 450 404 700 378 S1050 352 1200 384 L1200 420 L0 420Z"/>
    </svg>
    <h1 class="where"><span id="wName">—</span><span id="wRegion"></span></h1>
    <div class="datecard">
      <div class="dc-top"><span id="dcDay">—</span><span class="phase" id="dcPhase">—</span></div>
      <div class="dc-date" id="dcDate">—</div>
      <div class="dc-meta"><span id="dcOff">GMT</span><span id="dcZone"></span></div>
      <div class="dc-bar" aria-hidden="true"><i id="dcBar"></i></div>
    </div>
  </section>
</div>

<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const root = document.documentElement;
  const pad = (n) => String(n).padStart(2, '0');
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const MON3 = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

  /* ---------- Data ---------- */
  const CITIES = [
    ['los-angeles','Los Angeles','California, USA','America/Los_Angeles'],
    ['new-york','New York','New York, USA','America/New_York'],
    ['chicago','Chicago','Illinois, USA','America/Chicago'],
    ['denver','Denver','Colorado, USA','America/Denver'],
    ['toronto','Toronto','Ontario, Canada','America/Toronto'],
    ['mexico-city','Mexico City','Mexico','America/Mexico_City'],
    ['sao-paulo','São Paulo','Brazil','America/Sao_Paulo'],
    ['buenos-aires','Buenos Aires','Argentina','America/Argentina/Buenos_Aires'],
    ['honolulu','Honolulu','Hawaii, USA','Pacific/Honolulu'],
    ['anchorage','Anchorage','Alaska, USA','America/Anchorage'],
    ['london','London','United Kingdom','Europe/London'],
    ['dublin','Dublin','Ireland','Europe/Dublin'],
    ['paris','Paris','France','Europe/Paris'],

    if (el.strip.scrollLeft !== drag.scroll) { drag.scroll = el.strip.scrollLeft; updateDrag(); }
    drag.raf = requestAnimationFrame(autoScroll);
  }

  function onDragEnd(e) {
    if (!drag || e.pointerId !== drag.pid) return;
    const d = drag;
    drag = null;
    detachDragListeners();
    clearTimeout(d.timer);
    if (!d.active) return;                                       // just a tap; the click handler selects it
    cancelAnimationFrame(d.raf);
    suppressClick = true; setTimeout(() => { suppressClick = false; }, 60);
    d.wrap.style.transition = 'transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1)';
    d.wrap.style.transform = '';
    el.strip.classList.remove('is-dragging');
    setTimeout(() => {
      if (drag && drag.wrap === d.wrap) return;
      d.wrap.classList.remove('dragging'); d.wrap.style.transition = '';
    }, 220);
    commitOrder();
  }

  el.strip.addEventListener('touchmove', (e) => { if (drag && drag.active) e.preventDefault(); }, { passive: false });
  el.strip.addEventListener('contextmenu', (e) => { if (drag) e.preventDefault(); });

  el.strip.addEventListener('keydown', (e) => {
    if (!e.shiftKey || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
    const b = e.target.closest('.city');
    if (!b) return;
    e.preventDefault();
    const wrap = b.closest('.cw');
    const sib = e.key === 'ArrowLeft' ? wrap.previousElementSibling : wrap.nextElementSibling;
    if (!sib || !sib.classList.contains('cw')) return;
    if (e.key === 'ArrowLeft') el.strip.insertBefore(wrap, sib); else el.strip.insertBefore(sib, wrap);
    b.focus();
    b.scrollIntoView({ inline: 'nearest', block: 'nearest' });
    commitOrder();
  });

  /* Search / add city */
  let hits = [], active = -1;
  function drawResults() {
    const q = el.search.value.trim().toLowerCase();
    hits = CITIES.filter((c) => !state.ids.includes(c.id) && (!q || `${c.name} ${c.region} ${c.tz}`.toLowerCase().includes(q))).slice(0, 7);
    active = hits.length ? 0 : -1;
    el.results.textContent = '';
    const now = new Date();
    hits.forEach((c, i) => {
      const li = document.createElement('li'); li.setAttribute('role', 'option'); li.dataset.id = c.id;
      li.setAttribute('aria-selected', String(i === active));
      const a = document.createElement('span'); a.textContent = c.name;
      const s = document.createElement('small'); s.textContent = `${c.region} · ${fmtOffset(zoned(c.tz, now).off)}`;
      li.append(a, s); el.results.appendChild(li);
    });
    el.results.hidden = !hits.length;
  }
  function closeResults() { el.results.hidden = true; }
  function markActive() {
    [...el.results.children].forEach((li, i) => li.setAttribute('aria-selected', String(i === active)));
  }
  el.search.addEventListener('input', drawResults);
  el.search.addEventListener('focus', drawResults);
  el.search.addEventListener('blur', closeResults);
  el.search.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (hits.length) { active = (active + 1) % hits.length; markActive(); } }
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (hits.length) { active = (active - 1 + hits.length) % hits.length; markActive(); } }
    else if (e.key === 'Enter') { if (hits[active]) { addCity(hits[active].id); el.search.value = ''; closeResults(); el.search.blur(); } }
    else if (e.key === 'Escape') { el.search.blur(); }
  });
  el.results.addEventListener('mousedown', (e) => {
    e.preventDefault();                                           // keep focus until we're done
    const li = e.target.closest('li');
    if (li) { addCity(li.dataset.id); el.search.value = ''; closeResults(); el.search.blur(); }
  });

  /* Fullscreen */
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  function toggleFullscreen() {
    if (fsEl()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    const d = document.documentElement, req = d.requestFullscreen || d.webkitRequestFullscreen;
    if (req) { const p = req.call(d); if (p && p.catch) p.catch(() => {}); }
  }
  function onFs() { document.body.classList.toggle('is-full', !!fsEl()); }
  if (!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen)) el.fsBtn.hidden = true;
  document.addEventListener('fullscreenchange', onFs);
  document.addEventListener('webkitfullscreenchange', onFs);

  /* Buttons + keys */
  const setFmt = (v) => { state.hour12 = v; applyFormat(); };
  const toggleView = () => { state.view = state.view === 'digital' ? 'analog' : 'digital'; applyView(); };
  const toggleTheme = () => { state.theme = state.theme === 'dark' ? 'light' : 'dark'; applyTheme(); };
  el.f12.addEventListener('click', () => setFmt(true));
  el.f24.addEventListener('click', () => setFmt(false));
  el.viewBtn.addEventListener('click', toggleView);
  el.themeBtn.addEventListener('click', toggleTheme);
  el.fsBtn.addEventListener('click', toggleFullscreen);

  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target instanceof HTMLInputElement) return;
    switch (e.key.toLowerCase()) {
      case 'h': setFmt(!state.hour12); break;
      case 'v': toggleView(); break;
      case 't': toggleTheme(); break;
      case 'f': toggleFullscreen(); break;
      case '/': e.preventDefault(); el.search.focus(); break;
    }
  });

  document.addEventListener('visibilitychange', () => { if (document.hidden) stopLoops(); else startLoops(); });
  window.addEventListener('pagehide', stopLoops);

  /* ---------- Init ---------- */
  buildScene();
  buildDial();
  buildStrip();
  applyTheme();
  applyFormat();
  applyView();
  startLoops();
})();
</script>
</body>
</html>
